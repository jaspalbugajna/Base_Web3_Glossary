<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Base Web3 Glossary</title>
    <style>
        body { background: #0052ff; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        .container { background: #0022aa; padding: 30px; border-radius: 12px; border: 2px solid white; width: 400px; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
        .btn { display: block; width: 100%; padding: 10px; margin: 10px 0; background: white; color: #0052ff; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 16px; }
        .btn:hover { background: #00d2ff; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h2 id="question">Вопрос</h2>
        <div id="options"></div>
    </div>
    <script>
        const quizData = [
            { q: "Что такое Base?", options: ["Ethereum Layer 2 сеть", "Новый язык программирования", "Антивирус"], correct: 0 },
            { q: "Какой блокчейн лежит в основе Base?", options: ["Solana", "Ethereum", "Bitcoin"], correct: 1 },
            { q: "Какую технологию масштабирования использует Base?", options: ["Optimistic Rollups", "Proof of History", "Sharding"], correct: 0 }
        ];
        let currentQ = 0;
        const qEl = document.getElementById('question');
        const optEl = document.getElementById('options');

        function loadQuestion() {
            if (currentQ >= quizData.length) {
                qEl.innerText = "Тест пройден! Вы отлично знаете экосистему Base.";
                optEl.innerHTML = '<button class="btn" onclick="location.reload()">Пройти снова</button>';
                return;
            }
            let data = quizData[currentQ];
            qEl.innerText = data.q;
            optEl.innerHTML = "";
            data.options.forEach((opt, index) => {
                let btn = document.createElement('button');
                btn.classList.add('btn');
                btn.innerText = opt;
                btn.onclick = () => {
                    if (index === data.correct) { currentQ++; loadQuestion(); }
                    else { alert("Неверно, попробуйте еще раз!"); }
                };
                optEl.appendChild(btn);
            });
        }
        loadQuestion();
    </script>
</body>
</html>
